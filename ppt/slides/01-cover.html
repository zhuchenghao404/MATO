<!DOCTYPE html>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:#f5f5f5;font-family:'Comic Neue',cursive;position:relative;display:flex;align-items:center;justify-content:center}
  body::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 30% 40%,rgba(0,0,0,0.08) 1.5px,transparent 1.5px);background-size:18px 18px;z-index:0}
  .card{position:relative;z-index:1;background:#fff;border:6px solid #0a0a0a;box-shadow:12px 12px 0 rgba(0,0,0,0.18);padding:80px 100px;max-width:1500px;text-align:center}
  .title{font-family:'Bangers','Impact',sans-serif;font-size:120px;color:#0a0a0a;text-shadow:5px 5px 0 #fff,8px 8px 0 rgba(0,0,0,0.2);letter-spacing:4px;line-height:1;margin:0 0 20px}
  .sub{font-family:'Comic Neue',cursive;font-size:36px;color:#444;margin:0 0 16px}
  .tag{display:inline-block;font-family:'Bangers',sans-serif;font-size:24px;color:#fff;background:#0a0a0a;padding:6px 20px;border:2px solid #fff;transform:rotate(-1deg);margin:0 8px}
  .sfx{position:absolute;font-family:'Bangers',sans-serif;font-weight:900;color:#0a0a0a;opacity:0.08;pointer-events:none;z-index:0}
  .sfx1{font-size:180px;top:40px;left:60px;transform:rotate(-8deg)}
  .sfx2{font-size:140px;bottom:30px;right:60px;transform:rotate(6deg)}
  .sfx3{font-size:120px;top:50%;left:70%;transform:rotate(-3deg)}
  .author{font-family:'Comic Neue',cursive;font-size:28px;color:#666;margin-top:30px}
  .badge{display:inline-block;font-family:'Bangers',sans-serif;font-size:20px;letter-spacing:6px;color:#fff;background:#0a0a0a;padding:8px 24px;border:2px solid #fff;box-shadow:4px 4px 0 #555;margin-bottom:30px}
  .badge-star{color:#ffd700}
</style>
<div class="sfx sfx1">GO!</div>
<div class="sfx sfx2">WOW</div>
<div class="sfx sfx3">CODE</div>
<div class="card">
  <div class="badge"><span class="badge-star">*</span> 毕业设计答辩 <span class="badge-star">*</span></div>
  <h1 class="title">MATO 码途</h1>
  <p class="sub">基于 Vue3 的前端学习平台设计与实现</p>
  <div><span class="tag">体系教学</span><span class="tag">闯关挑战</span><span class="tag">优秀案例</span><span class="tag">自由画笔</span></div>
  <p class="author">答辩人：你的名字 · 指导老师：你的老师 · 2024</p>
</div>
</meta>
</html>
