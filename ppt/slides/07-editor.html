<!DOCTYPE html>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:#0a0a0a;font-family:'Comic Neue',cursive;position:relative;display:flex;align-items:center;justify-content:center}
  body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-15deg,transparent,transparent 8px,rgba(255,255,255,0.03) 8px,rgba(255,255,255,0.03) 16px)}
  .card{position:relative;z-index:1;padding:50px 80px;max-width:1500px;text-align:center}
  .title{font-family:'Bangers','Impact',sans-serif;font-size:64px;color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,0.5);margin:0 0 50px}
  .showcase{display:flex;gap:30px;align-items:flex-start}
  .screen{flex:1;background:#1d1e2b;border:4px solid #444;border-radius:8px;overflow:hidden}
  .screen-bar{background:#2d2d2d;padding:10px 16px;display:flex;gap:6px;align-items:center;border-bottom:2px solid #444}
  .dot{width:12px;height:12px;border-radius:50%}.d1{background:#ff5f57}.d2{background:#febc2e}.d3{background:#28c840}
  .screen-name{margin-left:8px;font-family:monospace;font-size:12px;color:#999}
  .screen-content{min-height:280px;display:flex;align-items:center;justify-content:center;padding:30px}
  .code-preview{background:#111;border:1px solid #333;padding:20px 30px;text-align:left;border-radius:4px;width:100%}
  .code-line{font-family:'Courier New',monospace;font-size:16px;color:#98c379;line-height:1.7;display:block}
  .code-line.html{color:#e06c75}.code-line.css{color:#61afef}.code-line.js{color:#e5c07b}
  .output-box{width:100%;min-height:200px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:6px;display:flex;align-items:center;justify-content:center}
  .output-text{font-family:'Bangers',sans-serif;font-size:40px;color:#ff6b35;text-shadow:0 0 30px rgba(255,107,53,0.4)}
  .features{display:flex;gap:20px;margin-top:40px;justify-content:center}
  .feat{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);padding:20px 30px;border-radius:6px}
  .feat-icon{font-size:32px;margin:0 0 8px}
  .feat-text{color:rgba(255,255,255,0.75);font-size:18px}
  .top-title{position:absolute;top:40px;left:100px;font-family:'Bangers','Impact',sans-serif;font-size:48px;color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,0.5);letter-spacing:3px;z-index:1}
</style>
<div class="top-title">自由画笔 · 在线编辑器</div>
<div class="card">
  <h2 class="title">基于 CodeMirror 6 的在线代码编辑</h2>
  <div class="showcase">
    <div class="screen"><div class="screen-bar"><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><span class="screen-name">HTML / CSS / JS</span></div><div class="screen-content"><div class="code-preview"><span class="code-line html">&lt;div class=&quot;greeting&quot;&gt;</span><span class="code-line">&nbsp;&nbsp;Hello World</span><span class="code-line html">&lt;/div&gt;</span><span class="code-line" style="opacity:0.4">---</span><span class="code-line css">.greeting { </span><span class="code-line css">&nbsp;&nbsp;color: #ff6b35;</span><span class="code-line css">}</span></div></div></div>
    <div class="screen"><div class="screen-bar"><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><span class="screen-name">实时预览输出</span></div><div class="screen-content"><div class="output-box"><span class="output-text">Hello World!</span></div></div></div>
  </div>
  <div class="features">
    <div class="feat"><div class="feat-icon">📝</div><div class="feat-text">三栏分屏编辑</div></div>
    <div class="feat"><div class="feat-icon">▶ </div><div class="feat-text">Ctrl+S 实时运行</div></div>
    <div class="feat"><div class="feat-icon">💾</div><div class="feat-text">保存到作品集</div></div>
    <div class="feat"><div class="feat-icon">📤</div><div class="feat-text">投稿优秀案例</div></div>
    <div class="feat"><div class="feat-icon">🔗</div><div class="feat-text">CDN 依赖引入</div></div>
  </div>
</div>
</meta>
</html>
